<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <title>captura</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }
            iframe {
                display: block;
                border: 0;
                width: 100vw;
                height: 100vh;
            }
        </style>
    </head>
    <body>
        <script>
            (function () {
                const q = new URLSearchParams(location.search);
                try {
                    localStorage.setItem(
                        "theme",
                        q.get("theme") === "dark" ? "dark" : "light",
                    );
                } catch (e) {
                    /* ignore */
                }
                const f = document.createElement("iframe");
                f.src = "/index.html";
                document.body.appendChild(f);
                f.addEventListener("load", function () {
                    const w = f.contentWindow,
                        d = f.contentDocument;
                    const st = d.createElement("style");
                    st.textContent = "::-webkit-scrollbar{display:none}";
                    d.head.appendChild(st);
                    let tries = 0;
                    const tick = function () {
                        tries++;
                        const rows = d.querySelectorAll(
                            ".tl-labels .tl-row",
                        ).length;
                        if (!rows && tries < 100) {
                            setTimeout(tick, 100);
                            return;
                        }
                        const y = Number(q.get("y") || 0);
                        if (y) w.scrollTo(0, y);
                        if (q.get("click")) {
                            const lab = d.querySelector(
                                ".tl-labels .tl-row text.lbl",
                            );
                            if (lab)
                                lab.dispatchEvent(
                                    new MouseEvent("click", { bubbles: true }),
                                );
                        }
                    };
                    setTimeout(tick, 200);
                });
            })();
        </script>
    </body>
</html>
